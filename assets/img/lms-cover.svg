<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Abstract interface preview of a learning management system">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c2f"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b84c"/>
      <stop offset="1" stop-color="#d99a2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d99a2b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d99a2b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="690" cy="70" r="190" fill="url(#glow)"/>
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 100h800M0 200h800M0 300h800M0 400h800"/>
    <path d="M100 0v500M200 0v500M300 0v500M400 0v500M500 0v500M600 0v500M700 0v500"/>
  </g>

  <!-- Browser window -->
  <rect x="70" y="64" width="660" height="372" rx="18" fill="#152238" stroke="#ffffff" stroke-opacity="0.09"/>
