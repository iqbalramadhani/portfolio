<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Abstract preview of a retrieval-augmented generation application">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c2f"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d99a2b"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)"/>
  <circle cx="120" cy="420" r="200" fill="url(#glow2)"/>
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 100h800M0 200h800M0 300h800M0 400h800"/>
    <path d="M100 0v500M200 0v500M300 0v500M400 0v500M500 0v500M600 0v500M700 0v500"/>
  </g>

  <!-- Document stack -->
  <g>
    <rect x="92" y="120" width="118" height="150" rx="10" fill="#1b2a44" stroke="#ffffff" stroke-opacity="0.1" transform="rotate(-8 151 195)"/>
    <rect x="106" y="132" width="118" height="150" rx="10" fill="#22334f" stroke="#ffffff" stroke-opacity="0.1" transform="rotate(-3 165 207)"/>
    <rect x="120" y="144" width="118" height="150" rx="10" fill="#2a3d5e" stroke="#ffffff" stroke-opacity="0.12"/>
    <g fill="#ffffff" fill-opacity="0.3">
      <rect x="138" y="166" width="64" height="8" rx="4"/>
      <rect x="138" y="186" width="82" height="6" rx="3"/>
      <rect x="138" y="202" width="74" height="6" rx="3"/>
      <rect x="138" y="218" width="84" height="6" rx="3"/>
      <rect x="138" y="234" width="56" height="6" rx="3"/>
    </g>
    <rect x="138" y="258" width="40" height="16" rx="8" fill="#d99a2b" opacity="0.7"/>
  </g>

  <!-- Connection lines -->
  <g fill="none" stroke="url(#flow)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7" opacity="0.75">
    <path d="M250 220 C 310 220, 300 150, 366 150"/>
    <path d="M250 230 C 320 230, 320 250, 366 250"/>
    <path d="M250 240 C 310 240, 300 350, 366 350"/>
  </g>

  <!-- Vector nodes -->
  <g>
    <circle cx="384" cy="150" r="18" fill="#1c2c47" stroke="#d99a2b" stroke-width="1.6"/>
    <circle cx="384" cy="150" r="5" fill="#d99a2b"/>
    <circle cx="384" cy="250" r="18" fill="#1c2c47" stroke="#4f8cff" stroke-width="1.6"/>
    <circle cx="384" cy="250" r="5" fill="#4f8cff"/>
    <circle cx="384" cy="350" r="18" fill="#1c2c47" stroke="#63d18a" stroke-width="1.6"/>
    <circle cx="384" cy="350" r="5" fill="#63d18a"/>
  </g>

  <!-- Retrieval block -->
  <rect x="444" y="140" width="140" height="220" rx="14" fill="#152238" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect x="462" y="162" width="70" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
  <g fill="#ffffff" fill-opacity="0.18">
    <rect x="462" y="188" width="104" height="6" rx="3"/>
    <rect x="462" y="204" width="88" height="6" rx="3"/>
    <rect x="462" y="220" width="98" height="6" rx="3"/>
    <rect x="462" y="236" width="72" height="6" rx="3"/>
  </g>
  <rect x="462" y="262" width="104" height="30" rx="8" fill="#1c2c47" stroke="#d99a2b" stroke-opacity="0.5"/>
  <rect x="474" y="274" width="56" height="6" rx="3" fill="#d99a2b" opacity="0.8"/>
  <rect x="462" y="306" width="104" height="30" rx="8" fill="#1c2c47" stroke="#4f8cff" stroke-opacity="0.4"/>
  <rect x="474" y="318" width="68" height="6" rx="3" fill="#4f8cff" opacity="0.8"/>

  <!-- LLM output -->
  <g>
    <rect x="620" y="170" width="108" height="88" rx="16" fill="#1c2c47" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="674" cy="214" r="22" fill="url(#flow)" opacity="0.9"/>
    <path d="M664 214l7 7 14-14" fill="none" stroke="#0b1220" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="640" y="272" width="68" height="7" rx="3.5" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Query bubble -->
  <g>
    <rect x="540" y="398" width="188" height="48" rx="24" fill="#f6e6c4"/>
    <circle cx="568" cy="422" r="5" fill="#b97b12"/>
    <circle cx="584" cy="422" r="5" fill="#b97b12" opacity="0.7"/>
    <circle cx="600" cy="422" r="5" fill="#b97b12" opacity="0.4"/>
    <rect x="620" y="416" width="80" height="12" rx="6" fill="#b97b12" opacity="0.55"/>
  </g>
</svg>
